<!doctype html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8E1230">
<title>Hisab Kitab</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #8E1230; color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
main { padding: 24px 20px; max-width: 420px; }
img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
h1 { font-size: 1.35rem; margin: 16px 0 6px; }
p { margin: 0 0 18px; opacity: .92; }
a, button { display: inline-block; font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 0; background: #fff; color: #8E1230; text-decoration: none; cursor: pointer; margin: 4px; }
button.alt { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Hisab Kitab ka naya address</h1>
  <p id="msg">hisab.nextgrade.in khul raha hai…</p>
  <a id="go" href="https://hisab.nextgrade.in/">Naya Hisab Kitab kholiye</a>
  <button type="button" class="alt" id="backup" hidden>Backup file lo</button>
</main>
<script>
// Hisab Kitab moved to https://hisab.nextgrade.in. Each web address has its own browser storage,
// so this page carries this phone's saved entries to the new address once, inside the link (#migrate=...).
// Nothing is sent to any server: the part after "#" never leaves the browser.
(function () {
  var NEW = "https://hisab.nextgrade.in/";
  var q = location.search.replace(/([?&])backup=1&?/, "$1").replace(/[?&]$/, "");
  var wantBackup = /[?&]backup=1/.test(location.search);
  var data = {}, has = false, moved = null;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("hisab") === 0 && k !== "hisab-moved-at") { data[k] = localStorage.getItem(k); has = true; }
    }
    moved = localStorage.getItem("hisab-moved-at");
  } catch (e) {}

  function allEntries() {
    var out = [], seen = {};
    for (var k in data) {
      if (k !== "hisab-kitab-entries-v1" && k.indexOf("hisab-kitab-acct:") !== 0) continue;
      try {
        var v = JSON.parse(data[k]);
        var list = Array.isArray(v) ? v : (v && v.entries) || [];
        list.forEach(function (e) { if (e && e.id && !seen[e.id]) { seen[e.id] = 1; out.push(e); } });
      } catch (e) {}
    }
    return out;
  }
  function showBackup(text) {
    document.getElementById("msg").textContent = text;
    var b = document.getElementById("backup");
    b.hidden = false;
    b.onclick = function () {
      var blob = new Blob([JSON.stringify({ app: "hisab-kitab", version: 1, exportedAt: new Date().toISOString(), entries: allEntries() }, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hisab-kitab-backup.json";
      document.body.appendChild(a); a.click(); a.remove();
    };
  }

  if (wantBackup) { showBackup(has ? "Backup file lijiye, phir naye address par ⋮ menu se “Backup se wapas lao” kariye." : "Is phone par purana hisab nahi mila."); return; }
  if (!has || moved) { location.replace(NEW + q); return; }
  var payload = "";
  try { payload = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data))))); } catch (e) {}
  if (!payload || payload.length > 1500000) {
    showBackup("Aapka hisab bahut bada hai, apne aap nahi ja payega. Pehle backup file lijiye, phir naye address par ⋮ menu se “Backup se wapas lao” kariye.");
    return;
  }
  try { localStorage.setItem("hisab-moved-at", String(Date.now())); } catch (e) {}
  location.replace(NEW + q + "#migrate=" + payload);
})();
</script>
</body>
</html>
